
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # This overrides the local localhost URL you might have in .env, pointing to our dockerized db container
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/content_factory
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_factory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_factory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
